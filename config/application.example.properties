# Configuración de ejemplo. Las rutas de entrada y salida se pasan por CLI.
# Para trabajar sin servicios de mapas: geocoder.mode=COORDINATES, distance.mode=HAVERSINE.

# ---- Salida ----
output.format=auto
output.csv.delimiter=;
output.csv.decimal=,
output.csv.bom=true
output.csv.charset=UTF-8

# ---- Entrada ----
input.csv.delimiter=auto
input.csv.charset=auto
input.csv.decimal=auto
input.xlsx.sheet=1
input.headerRow=1

# ---- Mapeo de columnas ----
# Los alias se comparan después de normalizar: recortar, minúsculas, quitar acentos y colapsar espacios.
columns.personas=personas
columns.origen=origen
columns.destino=destino
columns.transporte=transporte
columns.combustible=combustible
columns.evento=evento

# ---- Evento ----
# Prioridad del destino: destination.lat/destination.lon > destination.default > error fatal.
destination.default=
destination.lat=-31.4201
destination.lon=-64.1888
event.name=

# ---- Validación de filas ----
personas.min=1
personas.max=5
# personas.max.colectivo=

# ---- Valores por defecto ----
default.fuel.auto=NAFTA

# ---- Geocodificación ----
geocoder.mode=PHOTON
geocoder.file=
geo.bias.lat=
geo.bias.lon=
geo.bbox=
geo.maxCandidates=5
geo.cache.enabled=true
geo.cache.maxEntries=10000

# ---- Distancia ----
distance.mode=ROUTE
distance.fallback=HAVERSINE
distance.decimals=2
route.cache.enabled=true
route.cache.maxEntries=10000

# ---- Servicios externos ----
photon.baseUrl=http://localhost:2322
osrm.baseUrl=http://localhost:5000
http.timeoutMs=3000
http.retries=1
http.maxConsecutiveFailures=20
healthcheck.enabled=true

# ---- Servicios locales (modo BUNDLED) ----
services.mode=EXTERNAL
services.host=127.0.0.1
services.osrm.port=5000
services.photon.port=2322
services.startTimeoutSeconds=120
services.osrm.executable=./runtime/osrm/osrm-routed
services.osrm.data=./data/osrm/argentina.osrm
services.osrm.algorithm=mld
services.photon.java=./runtime/jre/bin/java
services.photon.jar=./runtime/photon/photon.jar
services.photon.dataDir=./data/photon
services.photon.heap=

# ---- Factores ----
factors.file=./config/emission-factors.properties

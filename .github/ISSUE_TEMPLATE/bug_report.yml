name: Bug report
description: Reportar un error o comportamiento inesperado en el proyecto
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Completá los campos relevantes en español. Si detectaste este bug mientras trabajabas en otra tarea, creá el issue aparte sin mezclarlo en esa rama.

  - type: textarea
    id: description
    attributes:
      label: Descripción del bug
      description: Qué falla y en qué módulo, clase o pantalla ocurre.
      placeholder: Ej. Al importar un archivo .xlsx sin filas de datos, falla el cálculo...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: Pasos mínimos y claros para reproducir el problema.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: Qué debería pasar.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué pasa realmente (incluyendo logs, stacktrace o captura si aplica).
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Entorno / Agente
      options:
        - OpenCode
        - Codex
        - Claude / Otro agente
        - Ejecución manual / Local
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional / Logs
      description: Logs relevantes, rama, versión de Java/herramienta o notas extra.
      render: shell
